
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Despesa</title>
</head>

<body>

    <h1>Editar Despesa</h1>

    <form th:action="@{/despesas/atualizar}"
          th:object="${despesa}" method="post">

        <input type="hidden" th:field="*{id}">

        <label for="descricao">Descrição:</label>
        <input id="descricao" type="text"
               th:field="*{descricao}" required>

        <br><br>

        <label for="valor">Valor (R$):</label>
        <input id="valor" type="number" min="0.01"
               step="0.01" th:field="*{valor}" required>

        <br><br>

        <label for="data">Data:</label>
        <input id="data" type="date"
               th:field="*{data}" required>

        <br><br>

        <button type="submit">Salvar Alterações</button>

    </form>

    <br>

    <a th:href="@{/despesas}">Voltar para despesas</a>

</body>
</html>
