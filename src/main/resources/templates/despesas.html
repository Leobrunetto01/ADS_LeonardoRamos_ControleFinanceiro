
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Financeiro - Despesas</title>
</head>

<body>

    <h1>Controle Financeiro Pessoal</h1>

    <h2>Cadastrar Despesa</h2>

    <form th:action="@{/despesas/salvar}"
          th:object="${despesa}" method="post">

        <label for="descricao">Descrição:</label>
        <input id="descricao" type="text"
               th:field="*{descricao}" required>

        <br><br>

        <label for="valor">Valor (R$):</label>
        <input id="valor" type="number" min="0.01"
               step="0.01" th:field="*{valor}" required>

        <br><br>

        <label for="data">Data:</label>
        <input id="data" type="date"
               th:field="*{data}" required>

        <br><br>

        <button type="submit">Salvar Despesa</button>

    </form>

    <hr>

    <h2>Despesas Cadastradas</h2>

    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th>ID</th>
                <th>Descrição</th>
                <th>Valor</th>
                <th>Data</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="d : ${despesas}">
                <td th:text="${d.id}"></td>
                <td th:text="${d.descricao}"></td>
                <td th:text="${#numbers.formatDecimal(d.valor, 1, 2)}"></td>
                <td th:text="${d.data}"></td>
                <td>
                    <a th:href="@{/despesas/editar/{id}(id=${d.id})}">
                        Editar
                    </a>

                    |

                    <a th:href="@{/despesas/excluir/{id}(id=${d.id})}"
                       onclick="return confirm('Deseja excluir esta despesa?');">
                        Excluir
                    </a>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(despesas)}">
                <td colspan="5">Nenhuma despesa cadastrada.</td>
            </tr>
        </tbody>
    </table>

    <br>

    <a th:href="@{/receitas}">Ver Receitas</a>

</body>
</html>
