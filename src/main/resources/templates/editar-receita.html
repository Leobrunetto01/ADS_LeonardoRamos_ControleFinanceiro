<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Editar Receita</title>
</head>

<body>

    <h1>Editar Receita</h1>

    <form th:action="@{/receitas/salvar}" th:object="${receita}" method="post">

        <input type="hidden" th:field="*{id}">

        <label>Descrição:</label>
        <input type="text" th:field="*{descricao}" required>

        <br><br>

        <label>Valor:</label>
        <input type="number" step="0.01" th:field="*{valor}" required>

        <br><br>

        <label>Data:</label>
        <input type="date" th:field="*{data}" required>

        <br><br>

        <button type="submit">Salvar Alterações</button>

    </form>

    <br>

    <a href="/receitas">Voltar para Receitas</a>

</body>

</html>
