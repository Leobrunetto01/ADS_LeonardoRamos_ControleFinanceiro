<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Receitas - Controle Financeiro</title>
</head>

<body>

    <h1>Controle Financeiro</h1>

    <h2>Cadastro de Receitas</h2>

    <form th:action="@{/receitas/salvar}" th:object="${receita}" method="post">

        <label>Descrição:</label>
        <input type="text" th:field="*{descricao}" required>

        <br><br>

        <label>Valor:</label>
        <input type="number" step="0.01" th:field="*{valor}" required>

        <br><br>

        <label>Data:</label>
        <input type="date" th:field="*{data}" required>

        <br><br>

        <button type="submit">Cadastrar Receita</button>

    </form>

    <hr>

    <h2>Receitas cadastradas</h2>

    <table border="1">

        <thead>
            <tr>
                <th>ID</th>
                <th>Descrição</th>
                <th>Valor</th>
                <th>Data</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody>

            <tr th:each="r : ${receitas}">

                <td th:text="${r.id}"></td>

                <td th:text="${r.descricao}"></td>

                <td th:text="${r.valor}"></td>

                <td th:text="${r.data}"></td>
                <td> 
 <td>
    <a th:href="@{/receitas/editar/{id}(id=${r.id})}">
        Editar
    </a>

    |

    <a th:href="@{/receitas/excluir/{id}(id=${r.id})}"
       onclick="return confirm('Tem certeza que deseja excluir esta receita?');">
        Excluir
    </a>
</td>

            </tr>

        </tbody>

    </table>

    <br>

    <a href="/login">Voltar</a>

</body>

</html>
